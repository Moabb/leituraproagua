<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER - Poções Pro Água</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --azul: #1f538d; --danger: #d32f2f; --success: #388e3c; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: var(--azul); color: white; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-right: 5px; }
        .btn { border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .btn-add { background: var(--azul); }
        .btn-status { font-size: 11px; }
        #login-screen { position: fixed; inset: 0; background: var(--azul); display: flex; align-items: center; justify-content: center; z-index: 999; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="card" style="width: 300px; text-align: center;">
            <h2>ADMIN MASTER</h2>
            <input type="password" id="input-senha" placeholder="Senha Mestra" style="width: 80%; margin-bottom: 10px;">
            <button class="btn btn-add" onclick="verificarSenha()" style="width: 88%;">ENTRAR</button>
        </div>
    </div>

    <div id="painel" style="display: none;" class="card">
        <h2>Gerenciador de Licenças</h2>
        <div style="margin-bottom: 20px;">
            <input type="text" id="nome" placeholder="Nome do Cliente">
            <input type="text" id="id-maquina" placeholder="ID da Máquina">
            <input type="text" id="expira" placeholder="28/02/2026">
            <button class="btn btn-add" onclick="salvarLicenca()">CADASTRAR</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>ID da Máquina</th>
                    <th>Expiração</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>

    <script>
        // 1. AJUSTE A URL: Deve terminar em /licencas (conforme sua imagem)
        const URL_BASE = "https://consuma-da-agua-default-rtdb.firebaseio.com/licencas";
        
        // 2. SENHA PROTEGIDA: O que você vê abaixo é o hash da senha "998877"
        // Mesmo inspecionando, ninguém sabe a senha real.
        const HASH_AUTORIZADO = "70c3f0f7f9859a2993f4e24a4962b1021469e3a7f8b9588669e4695863c0a370";

        function verificarSenha() {
            const senha = document.getElementById('input-senha').value;
            const hashDigitado = CryptoJS.SHA256(senha).toString();
            
            if (hashDigitado === HASH_AUTORIZADO) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('painel').style.display = 'block';
                carregarDados();
            } else { alert("Senha Inválida!"); }
        }

        async function carregarDados() {
            const r = await fetch(`${URL_BASE}.json`);
            const dados = await r.json();
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = "";

            for (let id_key in dados) {
                const item = dados[id_key];
                const ativo = item.ativo === true || item.ativo === "true";
                
                corpo.innerHTML += `
                    <tr>
                        <td>${item.nome || '---'}</td>
                        <td><code>${id_key}</code></td>
                        <td>${item.expiracao || '---'}</td>
                        <td>
                            <button class="btn btn-status" style="background:${ativo?'#28a745':'#dc3545'}" 
                                onclick="alternarStatus('${id_key}', ${ativo})">
                                ${ativo ? 'ATIVO' : 'BLOQUEADO'}
                            </button>
                        </td>
                        <td>
                            <button class="btn" style="background:#666" onclick="excluirLicenca('${id_key}')">Excluir</button>
                        </td>
                    </tr>`;
            }
        }

        async function salvarLicenca() {
            const id = document.getElementById('id-maquina').value.trim();
            const nomeCli = document.getElementById('nome').value.trim();
            const dataExp = document.getElementById('expira').value.trim();

            if (!id) return alert("O ID é obrigatório!");

            const payload = {
                nome: nomeCli,
                expiracao: dataExp,
                ativo: true
            };

            // Usamos PUT para gravar no ID específico sem gerar chaves aleatórias do Firebase
            await fetch(`${URL_BASE}/${id}.json`, {
                method: 'PUT',
                body: JSON.stringify(payload)
            });

            alert("Licença Salva!");
            carregarDados();
        }

        async function alternarStatus(id, statusAtual) {
            await fetch(`${URL_BASE}/${id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ ativo: !statusAtual })
            });
            carregarDados();
        }

        async function excluirLicenca(id) {
            if (confirm("Deseja realmente excluir esta licença?")) {
                await fetch(`${URL_BASE}/${id}.json`, { method: 'DELETE' });
                carregarDados();
            }
        }
    </script>
</body>
</html>
