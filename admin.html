<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER - Leitura Pro Água</title>
    <style>
        :root { --azul: #1f538d; --danger: #d32f2f; --success: #388e3c; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 950px; margin: auto; }
        
        /* LOGIN SCREEN */
        #login-screen { position: fixed; inset: 0; background: var(--azul); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 300px; text-align: center; }
        
        /* TABELA E INPUTS */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: var(--azul); color: white; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 10px; width: 90%; }
        .btn { border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; }
        .btn-add { background: var(--azul); width: 100%; margin-top: 10px; }
        .btn-status { font-size: 11px; min-width: 80px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--azul)">Leitura Pro Água</br>Painel Master</h2>
            <input type="text" id="user-input" placeholder="Usuário">
            <input type="password" id="pass-input" placeholder="Senha">
            <button class="btn btn-add" id="btn-entrar" onclick="autenticar()">ENTRAR</button>
            <p id="msg-erro" style="color:red; font-size: 12px; display:none; margin-top:10px;">Dados incorretos!</p>
        </div>
    </div>

    <div id="painel" style="display: none;" class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Gerenciador de Licenças e Vencimentos</h2>
            <a href="https://moabb.github.io/leituraproagua/manual.pdf" target="_blank"><button class="btn" style="background:#666">Manual.pdf</button></a>
            <button class="btn" style="background:#666" onclick="location.reload()">Sair</button>
        </div>
        
        <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; display: flex; gap: 10px; align-items: flex-end;">
            <div style="flex: 2">
                <label style="font-size: 12px; font-weight: bold;">Cliente</label><br>
                <input type="text" id="nome-cli" placeholder="Ex: HP - João" style="margin-bottom:0">
            </div>
            <div style="flex: 2">
                <label style="font-size: 12px; font-weight: bold;">ID Máquina</label><br>
                <input type="text" id="id-maquina" placeholder="Ex: -BFEBFBFF..." style="margin-bottom:0">
            </div>
            <div style="flex: 1">
                <label style="font-size: 12px; font-weight: bold;">Expiração</label><br>
                <input type="text" id="data-exp" placeholder="28/02/2026" style="margin-bottom:0">
            </div>
            <div style="flex: 1">
                <button class="btn btn-add" onclick="salvarLicenca()" style="margin:0">CADASTRAR</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>ID da Máquina</th>
                    <th>Expiração</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>

    <script>
        const URL_BASE = "https://consuma-da-agua-default-rtdb.firebaseio.com";

        async function autenticar() {
            const userIn = document.getElementById('user-input').value.trim();
            const passIn = document.getElementById('pass-input').value.trim();
            const btn = document.getElementById('btn-entrar');
            const msg = document.getElementById('msg-erro');

            btn.innerText = "Verificando...";
            
            try {
                const r = await fetch(`${URL_BASE}/admin.json`);
                const admin = await r.json();

                // O .trim() remove espaços vazios antes e depois do texto
                // Comparamos o que vem do Firebase (admin.senha) com o que você digitou (passIn)
                if (admin && 
                    admin.usuario.trim() === userIn && 
                    admin.senha.trim() === passIn) {
                    
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('painel').style.display = 'block';
                    carregarDados();
                } else {
                    msg.style.display = "block";
                    btn.innerText = "ENTRAR";
                    // Dica extra: limpa o campo de senha se errar
                    document.getElementById('pass-input').value = ""; 
                }
            } catch (e) {
                alert("Erro ao conectar ao banco de dados!");
                btn.innerText = "ENTRAR";
            }
        }

        async function carregarDados() {
            const r = await fetch(`${URL_BASE}/licencas.json`);
            const dados = await r.json();
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = "";
        
            if(!dados) return;
        
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0); // Zera as horas para comparação justa
        
            for (let id_key in dados) {
                const item = dados[id_key];
                const ativo = item.ativo === true || item.ativo === "true";
                
                // --- LÓGICA DE ALERTA DE VENCIMENTO ---
                let avisoVencimento = "";
                let estiloLinha = "";
                
                if (item.expiracao) {
                    // Converte a data do formato DD/MM/AAAA para objeto Date
                    const partes = item.expiracao.split("/");
                    const dataExp = new Date(partes[2], partes[1] - 1, partes[0]);
                    
                    // Calcula a diferença em dias
                    const diffTempo = dataExp - hoje;
                    const diffDias = Math.ceil(diffTempo / (1000 * 60 * 60 * 24));
        
                    if (diffDias <= 0 && ativo) {
                        avisoVencimento = "<br><small style='color:red'><b>🔴 EXPIRADO HOJE!</b></small>";
                        estiloLinha = "background-color: #ffebee;"; // Vermelho bem clarinho
                    } else if (diffDias > 0 && diffDias <= 10) {
                        avisoVencimento = `<br><small style='color:#856404'><b>⚠️ VENCE EM ${diffDias} DIAS</b></small>`;
                        estiloLinha = "background-color: #fff3cd;"; // Amarelo de atenção
                    }
                }
                // --------------------------------------
        
                corpo.innerHTML += `
                    <tr style="${estiloLinha}">
                        <td>
                            <strong>${item.nome || '---'}</strong>
                            ${avisoVencimento}
                        </td>
                        <td><code>${id_key}</code></td>
                        <td>${item.expiracao || '---'}</td>
                        <td>
                            <button class="btn btn-status" style="background:${ativo?'#28a745':'#dc3545'}" 
                                onclick="alternarStatus('${id_key}', ${ativo})">
                                ${ativo ? 'ATIVO' : 'BLOQUEADO'}
                            </button>
                        </td>
                        <td>
                            <button class="btn" style="background:#666; font-size:10px" onclick="excluirLicenca('${id_key}')">Excluir</button>
                        </td>
                    </tr>`;
            }
        }

        async function salvarLicenca() {
            const id = document.getElementById('id-maquina').value.trim();
            const nomeCli = document.getElementById('nome-cli').value.trim();
            const dataExp = document.getElementById('data-exp').value.trim();

            if (!id || !nomeCli) return alert("Preencha o Nome e o ID!");

            await fetch(`${URL_BASE}/licencas/${id}.json`, {
                method: 'PUT',
                body: JSON.stringify({ nome: nomeCli, expiracao: dataExp, ativo: true })
            });

            alert("Licença Salva!");
            document.getElementById('id-maquina').value = "";
            document.getElementById('nome-cli').value = "";
            carregarDados();
        }

        async function alternarStatus(id, statusAtual) {
            await fetch(`${URL_BASE}/licencas/${id}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ ativo: !statusAtual })
            });
            carregarDados();
        }

        async function excluirLicenca(id) {
            if (confirm(`Excluir licença de ${id}?`)) {
                await fetch(`${URL_BASE}/licencas/${id}.json`, { method: 'DELETE' });
                carregarDados();
            }
        }
    </script>
</body>
</html>
