<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ESCRITÓRIO - LEITURA PRO ÁGUA 💰</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --azul: #1f538d; --laranja: #e67e22; --verde: #28a745; --vermelho: #d32f2f; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 320px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .search-box { padding: 20px; border-bottom: 2px solid var(--azul); }
        .client-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .btn-cliente { width: 100%; text-align: left; padding: 12px; margin-bottom: 8px; border: 1px solid #eee; background: #fff; cursor: pointer; border-radius: 8px; font-size: 14px; }
        .btn-cliente:hover { background: #e3f2fd; border-color: var(--azul); }

        /* Main Content */
        .main { flex-grow: 1; display: flex; flex-direction: column; }
        /* Ajuste no Topo para não esmagar os botões */
        .topo { 
            background: white; 
            padding: 15px 25px; 
            display: flex; 
            flex-direction: column; /* Força os elementos a terem sua própria linha se necessário */
            gap: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        
        /* Container dos botões e info no topo */
        .topo-linha {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; /* Faz os botões pularem de linha se não couberem */
            gap: 10px;
        }

        /* Ajuste para as caixas de seleção (Isento/Fixo) */
        .opcoes-cliente {
            margin-top: 15px;
            display: flex;
            flex-direction: column; /* Coloca um embaixo do outro como no seu desenho */
            gap: 8px;
        }
        .conteudo { flex-grow: 1; padding: 30px; overflow-y: auto; }

        /* UI Elements */
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn { border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; margin: 2px; transition: 0.2s; }
        .btn-azul { background: var(--azul); }
        .btn-verde { background: var(--verde); }
        .btn-laranja { background: var(--laranja); }
        .btn-vermelho { background: var(--vermelho); }
        .btn-preto { background: #333; }
        .btn:hover { opacity: 0.8; }

        input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        input.checkbox { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 20px; box-sizing: border-box; margin-bottom: 10px; }
        input.pesquisa { padding: 10px; border: 1px solid #ddd; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
       
        /* Modais */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
        .modal-body { background: white; padding: 25px; border-radius: 12px; width: 600px; max-height: 85vh; overflow-y: auto; position: relative; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="search-box">
            <h3 style="margin:0 0 10px 0; color:var(--azul)">PESQUISAR RUA 🔍</h3>
            <input class="pesquisa" type="text" id="input-busca" placeholder="Nome ou rua..." oninput="filtrar()">
        </div>
        <div class="client-list" id="lista-clientes"></div>
    </div>

    <div class="main">
        <div class="topo">
            <div class="topo-linha">
                <div>
                    <button class="btn btn-preto" onclick="abrirModal('modal-cadastro')">NOVO CLIENTE</button>
                    <button class="btn btn-azul" onclick="gerarQRAcesso()">QR ACESSO</button>
                    <button class="btn btn-laranja" onclick="abrirModal('modal-operador')">OPERADORES</button>
                    <div id="txt-comunidade" style="margin-top:5px; font-weight:bold; color: var(--azul);">📍 Carregando...</div>
                </div>
                <div style="text-align: right;">
                    <button class="btn btn-vermelho" onclick="relatorioTodosDebitos()">TODOS DÉBITOS</button>
                    <button class="btn btn-azul" onclick="definirPreco()">PREÇO?</button>
                    <button class="btn btn-azul" onclick="definirTarifa()">TARIFA?</button>
                    <button class="btn btn-azul" onclick="definirValorFixo()">FIXO?</button>
                    <div id="lbl-info" style="margin-top:5px; font-size:13px; font-weight: bold; color: #555;"></div>
                </div>
            </div>
        </div>
        <div class="conteudo" id="painel-cliente">
            <div style="text-align:center; color:#999; margin-top:100px;">
                <h2>💹 SISTEMA DE GESTÃO - NUVEM</h2>
                <p>Selecione um cliente para gerenciar cobranças e histórico.</p>
            </div>
        </div>
    </div>

    <div id="modal-cadastro" class="modal">
        <div class="modal-body">
            <h3>Novo Cadastro de Cliente</h3>
            <input type="text" id="cad-nome" placeholder="Nome Completo">
            <input type="text" id="cad-rua" placeholder="Rua / Endereço">
            <input type="text" id="cad-num" placeholder="Número">
            <button class="btn btn-verde" style="width:100%" onclick="salvarCliente()">SALVAR NA NUVEM</button>
            <button class="btn btn-vermelho" style="width:100%; margin-top:5px;" onclick="fecharModais()">CANCELAR</button>
        </div>
    </div>

    <div id="modal-operador" class="modal">
        <div class="modal-body">
            <h3>Configurar Leiturista</h3>
            <p>Digite o nome do operador autorizado para esta conta.</p>
            <input type="text" id="op-nome" placeholder="NOME DO LEITURISTA">
            <button class="btn btn-laranja" style="width:100%" onclick="salvarOperador()">AUTORIZAR ACESSO</button>
            <button class="btn btn-vermelho" style="width:100%; margin-top:5px;" onclick="fecharModais()">VOLTAR</button>
        </div>
    </div>

    <div id="modal-lista" class="modal">
        <div class="modal-body">
            <h3 id="modal-titulo">Lista</h3>
            <div id="modal-dados"></div>
            <button class="btn btn-vermelho" style="width:100%; margin-top:15px" onclick="fecharModais()">FECHAR JANELA</button>
        </div>
    </div>

    <script>
    const URL_FB = "https://consuma-da-agua-default-rtdb.firebaseio.com/";
    const ID_MAQUINA = "-BFEBFBFF000206A7"; 

    let precoM3 = 0, taxaFixa = 0, valorFixoGlobal = 0, comunidade = "", clientes = {}, idSelecionado = null;

    // --- INICIALIZAÇÃO ---
    async function carregarConfig() {
        try {
            const r = await fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`);
            const d = await r.json();
            const estaAtivo = d.ativo === true;

            if(!d || !estaAtivo) {
                document.body.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#fff; font-family:sans-serif; text-align:center; padding: 20px;">
                        <h1 style="color:red; font-size:40px; margin-bottom:10px;">⚠️ ACESSO RESTRITO</h1>
                        <p style="font-size:18px; color:#555;">Sua licença não está ativa ou expirou.</p>
                        <p>Status no Sistema: <span style="color:red; font-weight:bold;">BLOQUEADO</span></p>
                        <br>
                        <button class="btn btn-azul" onclick="location.reload()">TENTAR NOVAMENTE</button>
                        <br><br>
                        <small style="color:#ccc;">ID: ${ID_MAQUINA}</small>
                    </div>`;
                return; 
            }
            // ---------------------------------

            precoM3 = parseFloat(d.valor_m3 || 0);
            taxaFixa = parseFloat(d.taxa_fixa || 0);
            valorFixoGlobal = parseFloat(d.valor_fixo_padrao || 0);
            comunidade = d.nome || "POÇÕES";

            document.getElementById('txt-comunidade').innerText = "📍 " + comunidade;
            document.getElementById('lbl-info').innerText = `m³: R$ ${precoM3.toFixed(2)} | TF: R$ ${taxaFixa.toFixed(2)} | FIXO: R$ ${valorFixoGlobal.toFixed(2)}`;
            
            await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/configuracoes.json`, {
                method: 'PATCH', body: JSON.stringify({preco_m3: precoM3, tarifa_fixa: taxaFixa})
            });

            atualizarLista();
        } catch(e) { console.error(e); }
    }

    async function atualizarLista() {
        const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes.json`);
        clientes = await r.json() || {};
        filtrar();
    }

    function filtrar() {
        const b = document.getElementById('input-busca').value.toUpperCase();
        const lista = document.getElementById('lista-clientes');
        lista.innerHTML = "";
        for(let id in clientes) {
            const c = clientes[id];
            if((c.rua || "").toUpperCase().includes(b) || (c.nome || "").toUpperCase().includes(b)) {
                lista.innerHTML += `<button class="btn-cliente" onclick="exibirCliente('${id}')">
                    <strong>${c.nome}</strong><br><small>${c.rua || 'S/R'}, ${c.numero || 'S/N'}</small>
                </button>`;
            }
        }
    }

    async function exibirCliente(id) {
        idSelecionado = id;
        const c = clientes[id];
        
        let ult = Number(c.leitura_atual || 0);
        
        try {
            const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
            const cobs = await r.json();
            if(cobs) {
                let lista = Object.values(cobs).filter(cb => cb && String(cb.id_cliente) === String(id));
                if(lista.length > 0) {
                    lista.sort((a,b) => Number(b.leitura_atual) - Number(a.leitura_atual));
                    let leituraBanco = Number(lista[0].leitura_atual);
                    if(leituraBanco > ult) ult = leituraBanco;
                }
            }
        } catch(e) { console.log("Erro ao sincronizar leitura atual"); }

        document.getElementById('painel-cliente').innerHTML = `
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #eee; padding-bottom:15px; flex-wrap: wrap; gap: 10px;">
                    <h2 style="margin:0">CLIENTE: ${c.nome}</h2>
                    <div>
                        <button class="btn btn-laranja" onclick="editarCliente('${id}')">EDITAR</button>
                        <button class="btn btn-vermelho" onclick="excluirCliente('${id}')">EXCLUIR</button>
                        <button class="btn btn-azul" onclick="verHistorico('${id}')">VER HISTÓRICO</button>
                    </div>
                </div>
                
                <div class="opcoes-cliente">
                    <label style="cursor:pointer; font-weight:bold; display: block; background: #f9f9f9; padding: 8px; border-radius: 5px;">
                        <input class="checkbox" type="checkbox" ${c.isento_tarifa?'checked':''} onchange="setIsencao('${id}', this.checked)"> 🛡️ ISENTO DE TARIFA FIXA
                    </label>
                    <label style="cursor:pointer; font-weight:bold; display: block; background: #f9f9f9; padding: 8px; border-radius: 5px;">
                        <input class="checkbox" type="checkbox" ${c.usar_valor_fixo?'checked':''} onchange="setUsaFixo('${id}', this.checked)"> 💰 COBRAR VALOR FIXO
                    </label>
                </div>

                <div style="background:#f0f7ff; padding:20px; border-radius:10px; margin-top:20px; display:flex; gap:15px; align-items:center; border: 1px solid #cde4ff;">
                    <div><strong>ANTERIOR (HIDRÔMETRO):</strong><br><span style="font-size:24px; color:var(--azul);">${ult} m³</span></div>
                    <div style="flex-grow:1">
                        <strong>NOVA LEITURA:</strong>
                        <input class="pesquisa" type="number" id="inp-atual" placeholder="0000" style="font-size:18px; margin:0">
                    </div>
                    <button class="btn btn-verde" style="height:45px" onclick="lancar('${id}', ${ult})">LANÇAR E GERAR PDF</button>
                    <button class="btn btn-azul" style="height:45px" onclick="reimprimir('${id}')">REIMPRIMIR ÚLTIMA</button>
                </div>

                <h3 style="margin-top:30px; color:var(--vermelho)">DÉBITOS PENDENTES</h3>
                <div id="lista-pendentes">Carregando pendências...</div>
            </div>`;
        carregarPendentes(id);
    }

    async function reimprimir(idCli) {
        try {
            const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
            const cobs = await r.json();
            
            if(!cobs) {
                alert("Não existem cobranças registradas no banco de dados.");
                return;
            }
            
            let lista = Object.values(cobs).filter(c => {
                return c && String(c.id_cliente) === String(idCli);
            });
            
            if(lista.length > 0) {
                lista.sort((a,b) => Number(b.leitura_atual) - Number(a.leitura_atual));
                const u = lista[0];
                
                const ant = Number(u.leitura_anterior || 0);
                const atu = Number(u.leitura_atual || 0);
                const cons = Number(u.consumo || 0);
                const val = Number(u.valor || 0);
                const tfa = Number(u.valor_tarifa || 0);

                gerarPDF(clientes[idCli], ant, atu, cons, val, tfa);
            } else { 
                alert("Nenhuma fatura encontrada para este morador. Verifique se o lançamento foi concluído no celular."); 
            }
        } catch(e) {
            console.error("Erro detalhado:", e);
            alert("Erro de sincronização. Tente recarregar a página (F5).");
        }
    }

    async function lancar(id, ant) {
    let atuInput = document.getElementById('inp-atual').value;
    let atu = parseInt(atuInput);
    const cliente = clientes[id];
    
    let consumo, tarifa, total;

    if (cliente.usar_valor_fixo) {
        consumo = 0; 
        tarifa = 0;
        total = valorFixoGlobal;
        if(isNaN(atu)) atu = ant;
    } else {
        if(isNaN(atu) || atu < ant) return alert("Erro: Nova leitura inválida!");
        consumo = atu - ant;
        tarifa = cliente.isento_tarifa ? 0 : taxaFixa;
        total = (consumo * precoM3) + tarifa;
    }

    const hoje = new Date().toLocaleDateString('pt-BR');
    const nova = {
        id_cliente: id, nome_cliente: cliente.nome,
        leitura_anterior: ant, leitura_atual: atu,
        consumo: consumo, valor: total, data_leitura: hoje,
        pago: false, valor_tarifa: tarifa, 
        tipo_cobranca: cliente.usar_valor_fixo ? "FIXA" : "M3"
    };

    await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`, {method:'POST', body:JSON.stringify(nova)});
    await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {method:'PATCH', body:JSON.stringify({leitura_atual: atu})});
    
    gerarPDF(cliente, ant, atu, consumo, total, tarifa);
    atualizarLista().then(() => exibirCliente(id));
}

    function gerarPDF(cli, ant, atu, cons, total, vTarifa) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const hoje = new Date().toLocaleDateString('pt-BR');
    const venc = new Date(Date.now() + 30*24*60*60*1000).toLocaleDateString('pt-BR');

    // --- CABEÇALHO ---
    doc.setFillColor(31, 83, 141);
    doc.rect(0, 0, 210, 30, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(18);
    doc.text("FATURA DA ÁGUA - " + comunidade, 105, 20, {align:'center'});

    // --- DADOS DO CONSUMIDOR ---
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(11);
    doc.text("DADOS DO CONSUMIDOR", 20, 45);
    doc.line(20, 47, 190, 47);
    
    doc.setFont("helvetica", "normal");
    doc.text(`NOME: ${cli.nome}`, 20, 55);
    doc.text(`ENDEREÇO: ${cli.rua || 'N/A'}, Nº ${cli.numero || 'S/N'}`, 20, 62);
    doc.text(`LOCALIDADE: ${comunidade}`, 20, 69);
    doc.text(`Emissão: ${hoje}`, 150, 55);

    // --- DETALHAMENTO DA LEITURA ---
    doc.setFont("helvetica", "bold");
    doc.text("DETALHAMENTO DA LEITURA", 20, 85);
    doc.line(20, 87, 190, 87);

    // Tabela de Leitura 
    doc.setFontSize(10);
    doc.text("LEITURA ANTERIOR", 20, 95);
    doc.text("LEITURA ATUAL", 65, 95);
    doc.text("CONSUMO", 110, 95);
    doc.text("PREÇO M³", 155, 95);

    doc.setFont("helvetica", "normal");
    doc.text(`${ant} m³`, 20, 102);
    doc.text(`${atu} m³`, 65, 102);
    doc.text(`${cons} m³`, 110, 102);
    doc.text(`R$ ${precoM3.toFixed(2)}`, 155, 102);

    // --- VALORES ---
    doc.line(20, 110, 190, 110);
    
    // LÓGICA DE EXIBIÇÃO CORRIGIDA:
    if (cli.usar_valor_fixo) {
        // Se for valor fixo, mostra apenas uma linha centralizada
        doc.text(`Sem Hidrómetro (Valor Fixo):`, 20, 120);
        doc.text(`R$ ${total.toFixed(2)}`, 160, 120);
    } else {
        // Se for consumo, mostra o detalhe do consumo + a tarifa de manutenção
        let valorConsumo = cons * precoM3;
        doc.text(`Valor do Consumo (${cons} x R$ ${precoM3.toFixed(2)}):`, 20, 120);
        doc.text(`R$ ${valorConsumo.toFixed(2)}`, 160, 120);

        doc.text(`Tarifa de Manutenção:`, 20, 128);
        doc.text(`R$ ${vTarifa.toFixed(2)}`, 160, 128);
    }

    // --- TOTAL A PAGAR ---
    doc.setFillColor(240, 240, 240);
    doc.rect(20, 140, 170, 25, 'F');
    
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("DATA DE VENCIMENTO", 30, 155);
    doc.text(venc, 85, 155);
    
    doc.text("TOTAL A PAGAR", 130, 155);
    doc.setFontSize(14);
    doc.setTextColor(200, 0, 0); 
    doc.text(`R$ ${total.toFixed(2)}`, 165, 155);

    // --- RODAPÉ ---
    doc.setTextColor(100, 100, 100);
    doc.setFontSize(9);
    doc.setFont("helvetica", "italic");
    doc.text("Mantenha suas contas em dia para garantir o fornecimento.", 105, 180, { align: 'center' }); 

    doc.save(`fatura_${cli.nome.replace(/\s/g, '_')}.pdf`);
}

    function gerarReciboPagamento(cli, valor_total, dataPagamento) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // --- BORDA DO RECIBO ---
    doc.setDrawColor(200);
    doc.rect(10, 10, 190, 90); // Cria um quadro compacto

    // --- CABEÇALHO ---
    doc.setFillColor(40, 40, 40);
    doc.rect(10, 10, 190, 15, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(14);
    doc.setFont("helvetica", "bold");
    doc.text("RECIBO DE PAGAMENTO - " + comunidade, 105, 20, { align: 'center' });

    // --- CORPO DO RECIBO ---
    doc.setTextColor(0, 0, 0);
    doc.setFontSize(12);
    doc.setFont("helvetica", "normal");
    
    doc.text(`Recebemos de: ${cli.nome}`, 20, 40);
    doc.text(`Endereço: ${cli.rua || 'N/A'}, Nº ${cli.numero || 'S/N'}`, 20, 48);
    
    doc.setFont("helvetica", "bold");
    doc.text(`VALOR PAGO: R$ ${parseFloat(valor_total).toFixed(2)}`, 20, 60);
    doc.text(`DATA: ${dataPagamento}`, 140, 60);

    // --- CAMPO DE ASSINATURA ---
    doc.line(60, 85, 150, 85); // Linha da assinatura
    doc.setFontSize(10);
    doc.setFont("helvetica", "italic");
    doc.text("Assinatura do Responsável", 105, 90, { align: 'center' });

    // Salva o arquivo
    doc.save(`recibo_${cli.nome.replace(/\s/g, '_')}.pdf`);
}

    async function verHistorico(idCli) {
        const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
        const cobs = await r.json() || {};
        document.getElementById('modal-titulo').innerText = "HISTÓRICO: " + clientes[idCli].nome;
        let html = "<table><tr><th>Data</th><th>Consumo</th><th>Valor</th><th>Status</th></tr>";
        let lista = Object.values(cobs).filter(c => c.id_cliente === idCli).sort((a,b) => b.leitura_atual - a.leitura_atual);
        lista.forEach(c => {
            html += `<tr><td>${c.data_leitura}</td><td>${c.consumo} m³</td><td>R$ ${c.valor.toFixed(2)}</td><td>${c.pago?'✅ Pago':'❌ Aberto'}</td></tr>`;
        });
        document.getElementById('modal-dados').innerHTML = html + "</table>";
        abrirModal('modal-lista');
    }

    async function relatorioTodosDebitos() {
        const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
        const cobs = await r.json() || {};
        let totalGeral = 0;
        document.getElementById('modal-titulo').innerText = "DÉBITOS GERAIS";
        let html = "<table><tr><th>Morador</th><th>Valor</th></tr>";
        for(let id in cobs) {
            if(!cobs[id].pago) {
                totalGeral += cobs[id].valor;
                html += `<tr><td>${cobs[id].nome_cliente}</td><td style="color:red">R$ ${cobs[id].valor.toFixed(2)}</td></tr>`;
            }
        }
        document.getElementById('modal-dados').innerHTML = html + `</table><h2 style="text-align:right">Total: R$ ${totalGeral.toFixed(2)}</h2>`;
        abrirModal('modal-lista');
    }

    async function editarCliente(id) {
        const c = clientes[id];
        const novoNome = prompt("Editar Nome:", c.nome);
        const novaRua = prompt("Editar Rua:", c.rua || "");
        const novoNum = prompt("Editar Número:", c.numero || "");
    
        if (novoNome && confirm("Confirmar alteração dos dados?")) {
            const dadosAtualizados = {
                nome: novoNome.toUpperCase(),
                rua: novaRua.toUpperCase(),
                numero: novoNum
            };
            
            await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {
                method: 'PATCH',
                body: JSON.stringify(dadosAtualizados)
            });
            
            alert("Dados atualizados com sucesso!");
            atualizarLista().then(() => exibirCliente(id));
        }
    }
    
    async function excluirCliente(id) {
        const c = clientes[id];
        if (confirm(`⚠️ ATENÇÃO: Deseja realmente excluir ${c.nome}?\nIsso não apagará o histórico de cobranças, apenas o cadastro do morador.`)) {
            if (confirm("TEM CERTEZA? Esta ação não pode ser desfeita!")) {
                await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {
                    method: 'DELETE'
                });
                
                alert("Cliente removido com sucesso.");
                document.getElementById('painel-cliente').innerHTML = `
                    <div style="text-align:center; color:#999; margin-top:100px;">
                        <h2>Cliente Excluído</h2>
                        <p>Selecione outro morador na lista lateral.</p>
                    </div>`;
                atualizarLista();
            }
        }
    }

    async function setUsaFixo(id, val) { 
        clientes[id].usar_valor_fixo = val; // Atualiza a memória na hora
        await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {
            method:'PATCH', 
            body:JSON.stringify({usar_valor_fixo: val})
        }); 
        clientes[id].usar_valor_fixo = val;
    }

    async function carregarPendentes(idCli) {
        const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
        const cobs = await r.json() || {};
        const p = document.getElementById('lista-pendentes');
        p.innerHTML = "";
        for(let id in cobs) {
            if(cobs[id].id_cliente === idCli && !cobs[id].pago) {
                p.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #eee; background:#fff;">
                    <span>📅 ${cobs[id].data_leitura} | <b>R$ ${cobs[id].valor.toFixed(2)}</b></span>
                    <button class="btn btn-laranja" onclick="darBaixa('${id}')">BAIXA</button>
                </div>`;
            }
        }
    }

    function definirValorFixo() {
        let n = prompt("Defina o valor para Clientes de Taxa Fixa (R$):", valorFixoGlobal);
        if(n) {
            fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`, {
                method:'PATCH', 
                body:JSON.stringify({valor_fixo_padrao: parseFloat(n)})
            }).then(() => {
                alert("Valor fixo global atualizado!");
                carregarConfig();
            });
        }
    }

    function definirPreco() {
        let n = prompt("Novo preço do m³:", precoM3);
        if(n) fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`, {method:'PATCH', body:JSON.stringify({valor_m3: parseFloat(n)})}).then(carregarConfig);
    }
    function definirTarifa() {
        let n = prompt("Novo valor da Tarifa Fixa:", taxaFixa);
        if(n) fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`, {method:'PATCH', body:JSON.stringify({taxa_fixa: parseFloat(n)})}).then(carregarConfig);
    }
    async function salvarOperador() {
        const nome = document.getElementById('op-nome').value.toUpperCase();
        if(!nome) return;
        await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/configuracoes.json`, {method:'PATCH', body:JSON.stringify({leiturista: nome})});
        alert("Operador " + nome + " autorizado!");
        fecharModais();
    }
    async function salvarCliente() {
        const n = document.getElementById('cad-nome').value.toUpperCase();
        const r = document.getElementById('cad-rua').value.toUpperCase();
        const nu = document.getElementById('cad-num').value;
        if(!n) return alert("Nome é obrigatório");
        await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes.json`, {method:'POST', body:JSON.stringify({nome:n, rua:r, numero:nu, leitura_atual:0, isento_tarifa:false, usar_valor_fixo:false})});
        fecharModais(); atualizarLista();
    }

    async function darBaixa(id) {
    if(confirm("Confirmar recebimento?")) {
        try {
            // 1. Busca a cobrança específica no Firebase
            const respCob = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas/${id}.json`);
            const cobranca = await respCob.json();
            
            // 2. Garante que o valor seja um número (se vier vazio ou texto, vira 0)
            // Verifique se no seu Firebase o campo é 'valor_total' ou 'valor'
            const valorPago = parseFloat(cobranca.valor_total || cobranca.valor || 0);

            // 3. Atualiza para pago no Firebase
            await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas/${id}.json`, {
                method:'PATCH', 
                body:JSON.stringify({pago:true})
            });

            // 4. Pega os dados do cliente e data
            const clienteAtual = clientes[idSelecionado]; 
            const dataHoje = new Date().toLocaleDateString('pt-BR');

            alert("Pagamento registrado com sucesso!");

            // 5. Gera o recibo com o valor já corrigido
            gerarReciboPagamento(clientes[idSelecionado], valorPago, dataHoje);

            // 6. Atualiza a interface
            exibirCliente(idSelecionado);
            
        } catch (e) {
            console.error("Erro ao dar baixa:", e);
            alert("Erro ao processar pagamento ou gerar recibo.");
        }
    }

    
}
    async function setIsencao(id, val) { 
        await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {method:'PATCH', body:JSON.stringify({isento_tarifa: val})}); 
        clientes[id].isento_tarifa = val;
    }
    function gerarQRAcesso() {
        const win = window.open("", "", "width=400,height=500");
        win.document.write(`<div style="text-align:center; padding:20px;"><h3>ACESSO COLABORADOR</h3><div id="q" style="display:inline-block"></div><br><h4>ID: ${ID_MAQUINA}</h4></div>`);
        new QRCode(win.document.getElementById("q"), ID_MAQUINA);
    }
    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function fecharModais() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }

    carregarConfig();
</script>
