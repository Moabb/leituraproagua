<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="logo512.png" type="image/x-icon">
    <title>LEITURA PRO ÁGUA 💰</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { 
            --azul: #1f538d; --laranja: #e67e22; --verde: #28a745; 
            --vermelho: #d32f2f; --bg: #f4f7f6; --cinza: #34495e; 
        }

        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); 
            margin: 0; display: flex; flex-direction: column; 
            min-height: 100vh; overflow-x: hidden;
        }

        /* BARRA SUPERIOR E BUSCA */
        .sidebar { width: 100%; background: white; border-bottom: 2px solid var(--azul); position: sticky; top: 0; z-index: 100; }
        .search-box { padding: 10px; }
        .pesquisa { padding: 12px; width: 100%; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        
        .client-list { max-height: 140px; overflow-y: auto; padding: 10px; background: #fff; border-bottom: 1px solid #ddd; }
        .btn-cliente { 
            width: 100%; padding: 12px; margin-bottom: 5px; border: 1px solid #eee; 
            background: #fff; border-radius: 8px; text-align: left; font-size: 14px;
        }

        /* MENUS ESTILO DROPDOWN */
        .topo { background: white; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-container { margin-bottom: 8px; width: 100%; }
        
        .btn-menu-pai { 
            width: 100%; padding: 15px; border: none; border-radius: 8px; 
            color: white; font-weight: bold; font-size: 16px; text-align: left;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .bg-cadastro { background: var(--cinza); }
        .bg-valores { background: var(--azul); }

        .submenu { 
            display: none; /* Começa escondido */
            grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; 
            background: #f1f1f1; border-radius: 0 0 8px 8px; 
        }

        /* BOTÕES DE AÇÃO */
        .btn { border: none; padding: 12px; border-radius: 6px; color: white; font-weight: bold; font-size: 12px; text-align: center; cursor: pointer; }
        .btn-azul { background: var(--azul); }
        .btn-verde { background: var(--verde); }
        .btn-laranja { background: var(--laranja); }
        .btn-vermelho { background: var(--vermelho); }
        .btn-preto { background: #333; }

        /* MODAIS (JANELAS QUE ESTAVAM APARECENDO) */
        .modal { 
            display: none; /* Garante que fiquem escondidos */
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center; 
        }
        .modal-body { background: white; padding: 20px; border-radius: 15px; width: 90%; max-height: 85vh; overflow-y: auto; }

        /* ÁREA DE LANÇAMENTO (O CARD) */
        .conteudo { padding: 10px; }
        .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        input[type="number"], input[type="text"] { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }

        #txt-comunidade { text-align: center; font-weight: bold; color: var(--azul); margin-bottom: 8px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="search-box">
            <input class="pesquisa" type="text" id="input-busca" placeholder="🔎 Pesquisar morador..." oninput="filtrar()">
        </div>
        <div class="client-list" id="lista-clientes"></div>
    </div>

    <div class="main">
        <div class="topo">
            <div id="txt-comunidade">📍 Carregando...</div>

            <div class="menu-container">
                <button class="btn-menu-pai bg-cadastro" onclick="toggleMenu('menu-cad')">📂 CADASTRO <span>▼</span></button>
                <div id="menu-cad" class="submenu">
                    <button class="btn btn-preto" onclick="abrirModal('modal-cadastro')">NOVO CLIENTE</button>
                    <button class="btn btn-vermelho" onclick="trocarAssinatura()">TROCAR ID</button>
                    <button class="btn btn-laranja" onclick="abrirModal('modal-operador')">LEITURISTA</button>
                    <button class="btn btn-azul" onclick="gerarQRAcesso()">QR ACESSO</button>
                </div>
            </div>

            <div class="menu-container">
                <button class="btn-menu-pai bg-valores" onclick="toggleMenu('menu-val')">💰 VALORES <span>▼</span></button>
                <div id="menu-val" class="submenu">
                    <button class="btn btn-vermelho" onclick="relatorioTodosDebitos()">TODOS DÉBITOS</button>
                    <button class="btn" style="background:#8e44ad" onclick="definirDiaVencimento()">VENCIMENTO</button>
                    <button class="btn" style="background:#8e44ad" onclick="definirPagamento()">PAGAMENTO</button>
                    <button class="btn btn-azul" onclick="definirPreco()">PREÇO?</button>
                    <button class="btn btn-azul" onclick="definirTarifa()">TARIFA?</button>
                    <button class="btn btn-azul" onclick="definirValorFixo()">VALOR FIXO?</button>
                </div>
            </div>
            <div id="lbl-info" style="font-size:11px; text-align:center; color:#666;"></div>
        </div>

        <div class="conteudo" id="painel-cliente">
            <div style="text-align:center; color:#999; margin-top:30px; padding:20px; border:2px dashed #ccc; border-radius:10px;">
                <p>Aguardando seleção de morador...</p>
            </div>
        </div>
    </div>

    <div id="modal-cadastro" class="modal">
        <div class="modal-body">
            <h3>Novo Cadastro</h3>
            <input type="text" id="cad-nome" placeholder="Nome do Morador">
            <input type="text" id="cad-rua" placeholder="Rua / Local">
            <button class="btn btn-verde" style="width:100%" onclick="salvarCliente()">SALVAR MORADOR</button>
            <button class="btn btn-vermelho" style="width:100%; margin-top:10px;" onclick="fecharModais()">FECHAR</button>
        </div>
    </div>

    <div id="modal-operador" class="modal">
        <div class="modal-body">
            <h3>Leiturista Atual</h3>
            <input type="text" id="op-nome" placeholder="Nome de quem está medindo">
            <button class="btn btn-laranja" style="width:100%" onclick="salvarOperador()">CONFIRMAR</button>
            <button class="btn btn-vermelho" style="width:100%; margin-top:10px;" onclick="fecharModais()">VOLTAR</button>
        </div>
    </div>

    <div id="modal-lista" class="modal">
        <div class="modal-body">
            <h3 id="modal-titulo">Relatório</h3>
            <div id="modal-dados" style="font-size:12px;"></div>
            <button class="btn btn-vermelho" style="width:100%; margin-top:15px" onclick="fecharModais()">FECHAR</button>
        </div>
    </div>

    <script>
        // TODA A SUA LÓGICA ORIGINAL DO ARQUIVO MOVEL.TXT FOI MANTIDA ABAIXO
        const URL_FB = "https://consuma-da-agua-default-rtdb.firebaseio.com/";
        let ID_MAQUINA = localStorage.getItem('id_licenca_ativa');
        
        let precoM3 = 0, taxaFixa = 0, valorFixoGlobal = 0, diaVencimento = 10, comunidade = "", clientes = {}, idSelecionado = null;

        window.onload = carregarConfig;

        // FUNÇÃO PARA ABRIR/FECHAR MENUS (NOVO)
        function toggleMenu(id) {
            const menu = document.getElementById(id);
            const estaAberto = menu.style.display === 'grid';
            // Fecha todos antes
            document.querySelectorAll('.submenu').forEach(m => m.style.display = 'none');
            // Abre o selecionado se estava fechado
            if (!estaAberto) menu.style.display = 'grid';
        }

        function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
        function fecharModais() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

        async function carregarConfig() {
            if (!ID_MAQUINA || ID_MAQUINA === "null") {
                ID_MAQUINA = prompt("INSIRA O ID DA LICENÇA:");
                if (ID_MAQUINA) localStorage.setItem('id_licenca_ativa', ID_MAQUINA);
                else return;
            }
            try {
                const r = await fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`);
                const d = await r.json();
                if(!d || d.ativo !== true) {
                    alert("ID INVÁLIDO");
                    localStorage.removeItem('id_licenca_ativa');
                    location.reload();
                    return;
                }
                precoM3 = parseFloat(d.valor_m3 || 0);
                taxaFixa = parseFloat(d.taxa_fixa || 0);
                comunidade = d.nome || "SISTEMA";
                document.getElementById('txt-comunidade').innerText = "📍 " + comunidade;
                document.getElementById('lbl-info').innerText = `Valor m³: R$ ${precoM3.toFixed(2)}`;
                atualizarLista();
            } catch(e) { alert("Erro ao conectar com Firebase."); }
        }

        async function atualizarLista() {
            const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes.json`);
            clientes = await r.json() || {};
            filtrar();
        }

        function filtrar() {
            const b = document.getElementById('input-busca').value.toUpperCase();
            const lista = document.getElementById('lista-clientes');
            lista.innerHTML = "";
            for(let id in clientes) {
                if(clientes[id].nome.toUpperCase().includes(b)) {
                    lista.innerHTML += `<button class="btn-cliente" onclick="exibirCliente('${id}')">👤 ${clientes[id].nome}</button>`;
                }
            }
        }

        async function exibirCliente(id) {
            idSelecionado = id;
            const c = clientes[id];
            const ult = c.leitura_atual || 0;
            
            document.getElementById('painel-cliente').innerHTML = `
                <div class="card">
                    <h3 style="margin:0; color:var(--azul)">${c.nome}</h3>
                    <p style="font-size:12px; color:#666">Anterior: <strong>${ult} m³</strong></p>
                    <hr>
                    <label>LANÇAR NOVA LEITURA:</label>
                    <input type="number" id="inp-atual" placeholder="0000" style="font-size:24px; text-align:center; height:60px; font-weight:bold; border:2px solid var(--azul);">
                    <button class="btn btn-verde" style="width:100%; height:50px; font-size:16px;" onclick="lancar('${id}', ${ult})">SALVAR E GERAR PDF</button>
                    <br><br>
                    <button class="btn btn-laranja" style="width:100%" onclick="verHistorico('${id}')">VER HISTÓRICO</button>
                    <div id="lista-pendentes" style="margin-top:15px"></div>
                </div>`;
        }

        // As demais funções (lancar, salvarCliente, trocarAssinatura, etc) 
        // devem ser coladas aqui conforme o seu arquivo movel.txt original.
        function trocarAssinatura() {
            if(confirm("Deseja trocar o ID da máquina?")) {
                localStorage.removeItem('id_licenca_ativa');
                location.reload();
            }
        }
    </script>
</body>
</html>
