<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="logo512.png" type="image/x-icon">
    <title>LEITURA PRO ÁGUA 💰</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { 
            --azul: #1f538d; --laranja: #e67e22; --verde: #28a745; 
            --vermelho: #d32f2f; --bg: #f4f7f6; --cinza: #34495e; 
        }

        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); 
            margin: 0; display: flex; flex-direction: column; 
            min-height: 100vh; overflow-x: hidden;
        }

        /* BUSCA E LISTA */
        .sidebar { width: 100%; background: white; border-bottom: 2px solid var(--azul); position: sticky; top: 0; z-index: 100; }
        .search-box { padding: 10px; }
        .pesquisa { padding: 12px; width: 100%; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        .client-list { max-height: 150px; overflow-y: auto; padding: 10px; background: #f9f9f9; border-bottom: 1px solid #ddd; }
        .btn-cliente { width: 100%; padding: 12px; margin-bottom: 5px; border: 1px solid #eee; background: #fff; border-radius: 8px; text-align: left; font-size: 14px; }

        /* TOPO COM MENUS LADO A LADO */
        .topo { background: white; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .row-menus { display: flex; gap: 8px; margin-bottom: 5px; }
        .menu-container { flex: 1; position: relative; }
        
        .btn-menu-pai { 
            width: 100%; padding: 12px 5px; border: none; border-radius: 8px; 
            color: white; font-weight: bold; font-size: 13px; text-align: center;
            display: flex; justify-content: center; align-items: center; gap: 5px; cursor: pointer;
        }
        .bg-cadastro { background: var(--cinza); }
        .bg-valores { background: var(--azul); }

        .submenu { 
            display: none; position: absolute; left: 0; right: 0;
            grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; 
            background: #fff; border: 1px solid #ddd; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 150; top: 45px;
        }

        /* BOTÕES GERAIS */
        .btn { border: none; padding: 10px; border-radius: 6px; color: white; font-weight: bold; font-size: 11px; text-align: center; cursor: pointer; transition: 0.2s; }
        .btn-azul { background: var(--azul); }
        .btn-verde { background: var(--verde); }
        .btn-laranja { background: var(--laranja); }
        .btn-vermelho { background: var(--vermelho); }
        .btn-preto { background: #333; }
        .btn:active { opacity: 0.7; transform: scale(0.98); }

        /* CONTEÚDO E CARDS */
        .conteudo { padding: 10px; flex-grow: 1; }
        .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #eee; margin-bottom: 15px; }
        
        /* ÁREA DE LANÇAMENTO */
        .lancamento-area { background: #f0f7ff; padding: 15px; border-radius: 10px; border: 1px solid #cde4ff; margin-top: 15px; }
        .inp-leitura { font-size: 24px !important; text-align: center; height: 60px !important; font-weight: bold; color: var(--azul); }

        /* MODAIS */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center; }
        .modal-body { background: white; padding: 20px; border-radius: 15px; width: 90%; max-height: 85vh; overflow-y: auto; }

        input { margin-bottom: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 16px; }
        .checkbox { width: 22px !important; height: 22px !important; margin: 0 !important; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 10px 5px; border-bottom: 1px solid #eee; text-align: left; }
        
        #txt-comunidade { text-align: center; font-weight: bold; color: var(--azul); margin-bottom: 5px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="search-box">
            <input class="pesquisa" type="text" id="input-busca" placeholder="🔎 Nome ou Rua..." oninput="filtrar()">
        </div>
        <div class="client-list" id="lista-clientes"></div>
    </div>

    <div class="main">
        <div class="topo">
            <div id="txt-comunidade">📍 Carregando...</div>
            <div class="row-menus">
                <div class="menu-container">
                    <button class="btn-menu-pai bg-cadastro" onclick="toggleMenu('menu-cad')">📂 CADASTRO</button>
                    <div id="menu-cad" class="submenu">
                        <button class="btn btn-preto" onclick="abrirModal('modal-cadastro')">NOVO</button>
                        <button class="btn btn-vermelho" onclick="trocarAssinatura()" style="background: #7f8c8d;">ID</button>
                        <button class="btn btn-laranja" style="background:#7f8c8d" onclick="abrirModal('modal-operador')">OPERADOR</button>
                        <button class="btn btn-azul" onclick="relatorioConsumoMensal()">MÊS TOTAL</button>
                    </div>
                </div>
                <div class="menu-container">
                    <button class="btn-menu-pai bg-valores" onclick="toggleMenu('menu-val')">💰 VALORES</button>
                    <div id="menu-val" class="submenu">
                        <button class="btn btn-vermelho" onclick="relatorioTodosDebitos()">DÉBITOS</button>
                        <button class="btn" style="background:#8e44ad" onclick="definirDiaVencimento()">VENCIM.</button>
                        <button class="btn" style="background:#8e44ad" onclick="definirPagamento()">PAGAM.</button>
                        <button class="btn btn-azul" onclick="definirPreco()">PREÇO</button>
                        <button class="btn btn-azul" onclick="definirTarifa()">TARIFA</button>
                        <button class="btn btn-azul" onclick="definirValorFixo()">FIXO</button>
                    </div>
                </div>
            </div>
            <div id="lbl-info" style="font-size:11px; text-align:center; color:#555; font-weight: bold;"></div>
        </div>

        <div class="conteudo" id="painel-cliente">
            <div style="text-align:center; color:#999; margin-top:50px; padding: 20px;">
                <h2>💹 SISTEMA NUVEM</h2>
                <p>Selecione um cliente para gerenciar.</p>
            </div>
        </div>
    </div>

    <div id="modal-cadastro" class="modal"><div class="modal-body"><h3>Novo Cliente</h3><input type="text" id="cad-nome" placeholder="Nome Completo"><input type="text" id="cad-rua" placeholder="Rua / Endereço"><input type="text" id="cad-num" placeholder="Número"><button class="btn btn-verde" style="width:100%; padding:15px" onclick="salvarCliente()">SALVAR NA NUVEM</button><button class="btn btn-vermelho" style="width:100%;margin-top:10px" onclick="fecharModais()">CANCELAR</button></div></div>
    <div id="modal-operador" class="modal"><div class="modal-body"><h3>Leiturista</h3><input type="text" id="op-nome" placeholder="NOME DO OPERADOR"><button class="btn btn-laranja" style="width:100%" onclick="salvarOperador()">AUTORIZAR</button><button class="btn btn-vermelho" style="width:100%;margin-top:10px" onclick="fecharModais()">VOLTAR</button></div></div>
    <div id="modal-lista" class="modal"><div class="modal-body"><h3 id="modal-titulo"></h3><div id="modal-dados"></div><button class="btn btn-vermelho" style="width:100%;margin-top:15px; padding:15px" onclick="fecharModais()">FECHAR JANELA</button></div></div>

    <script>
        // --- INÍCIO DA LÓGICA DO SEU ARQUIVO ORIGINAL (MOVEL.TXT) ---
        const URL_FB = "https://consuma-da-agua-default-rtdb.firebaseio.com/";
        let ID_MAQUINA = localStorage.getItem('id_licenca_ativa') || new URLSearchParams(window.location.search).get('id');
        let precoM3 = 0, taxaFixa = 0, valorFixoGlobal = 0, diaVencimento = 10, comunidade = "", clientes = {}, idSelecionado = null, dadosPagamento = "";

        // UI Helpers
        function toggleMenu(id) {
            const menu = document.getElementById(id);
            const isVisible = menu.style.display === 'grid';
            document.querySelectorAll('.submenu').forEach(m => m.style.display = 'none');
            menu.style.display = isVisible ? 'none' : 'grid';
        }
        function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
        function fecharModais() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

        window.onload = carregarConfig;

        async function carregarConfig() {
            if (!ID_MAQUINA || ID_MAQUINA === "null") {
                ID_MAQUINA = prompt("SISTEMA NÃO IDENTIFICADO.\nInsira o ID da Licença:");
                if (ID_MAQUINA) localStorage.setItem('id_licenca_ativa', ID_MAQUINA);
                else return;
            }
            try {
                const r = await fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`);
                const d = await r.json();
                if(!d || d.ativo !== true) {
                    localStorage.removeItem('id_licenca_ativa');
                    document.body.innerHTML = `<div style="text-align:center;padding:50px;"><h1>⚠️ LICENÇA INVÁLIDA</h1><button class="btn btn-azul" onclick="location.reload()">TENTAR OUTRO ID</button></div>`;
                    return;
                }
                dadosPagamento = d.dados_pagamento || "Não informado";
                precoM3 = parseFloat(d.valor_m3 || 0);
                taxaFixa = parseFloat(d.taxa_fixa || 0);
                valorFixoGlobal = parseFloat(d.valor_fixo_padrao || 0);
                diaVencimento = parseInt(d.dia_vencimento || 10);
                comunidade = d.nome || "COMUNIDADE";
                document.getElementById('txt-comunidade').innerText = "📍 " + comunidade;
                document.getElementById('lbl-info').innerText = `m³: R$ ${precoM3.toFixed(2)} | TF: R$ ${taxaFixa.toFixed(2)} | FIXO: R$ ${valorFixoGlobal.toFixed(2)}`;
                atualizarLista();
            } catch(e) { alert("Erro de conexão com a nuvem."); }
        }

        async function atualizarLista() {
            const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes.json`);
            clientes = await r.json() || {};
            filtrar();
        }

        function filtrar() {
            const b = document.getElementById('input-busca').value.toUpperCase();
            const lista = document.getElementById('lista-clientes');
            lista.innerHTML = "";
            for(let id in clientes) {
                const c = clientes[id];
                if((c.rua || "").toUpperCase().includes(b) || (c.nome || "").toUpperCase().includes(b)) {
                    lista.innerHTML += `<button class="btn-cliente" onclick="exibirCliente('${id}')"><strong>${c.nome}</strong><br><small>${c.rua || 'S/R'}, ${c.numero || 'S/N'}</small></button>`;
                }
            }
        }

        async function exibirCliente(id) {
            idSelecionado = id;
            const c = clientes[id];
            let ult = Number(c.leitura_atual || 0);

            // Sincronização de leitura do histórico (Lógica original)
            try {
                const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
                const cobs = await r.json();
                if(cobs) {
                    let lista = Object.values(cobs).filter(cb => cb && String(cb.id_cliente) === String(id));
                    if(lista.length > 0) {
                        lista.sort((a,b) => Number(b.leitura_atual) - Number(a.leitura_atual));
                        if(Number(lista[0].leitura_atual) > ult) ult = Number(lista[0].leitura_atual);
                    }
                }
            } catch(e) {}

            document.getElementById('painel-cliente').innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:start; border-bottom:1px solid #eee; padding-bottom:10px;">
                        <div>
                            <h3 style="margin:0; color:var(--azul)">${c.nome}</h3>
                            <small>${c.rua || 'S/R'}, ${c.numero || 'S/N'}</small>
                        </div>
                        <div style="display:flex; gap:5px;">
                            <button class="btn btn-vermelho" onclick="excluirCliente('${id}')">EXCLUIR</button>
                            <button class="btn btn-laranja" onclick="editarCliente('${id}')">EDITAR</button>
                        </div>
                    </div>
                    
                    <div style="margin-top:10px; display:grid; gap:8px;">
                        <label style="display:flex; align-items:center; gap:10px; background:#f9f9f9; padding:8px; border-radius:5px; font-size:12px; font-weight:bold;">
                            <input class="checkbox" type="checkbox" ${c.isento_tarifa?'checked':''} onchange="setIsencao('${id}', this.checked)"> 🛡️ ISENTO TARIFA
                        </label>
                        <label style="display:flex; align-items:center; gap:10px; background:#f9f9f9; padding:8px; border-radius:5px; font-size:12px; font-weight:bold;">
                            <input class="checkbox" type="checkbox" ${c.usar_valor_fixo?'checked':''} onchange="setUsaFixo('${id}', this.checked)"> 💰 VALOR FIXO
                        </label>
                    </div>

                    <div class="lancamento-area">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <span>ANTERIOR: <strong>${ult} m³</strong></span>
                            <button class="btn btn-azul" onclick="verHistorico('${id}')">VER HISTÓRICO</button>
                        </div>
                        <input type="number" id="inp-atual" class="inp-leitura" placeholder="0000">
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                            <button class="btn btn-verde" style="height:50px; font-size:13px" onclick="lancar('${id}', ${ult})">LANÇAR / PDF</button>
                            <button class="btn btn-azul" style="height:50px; font-size:13px" onclick="reimprimir('${id}')">REIMPRIMIR</button>
                        </div>
                    </div>

                    <h4 style="margin:15px 0 10px 0; color:var(--vermelho)">DÉBITOS PENDENTES</h4>
                    <div id="lista-pendentes">Carregando...</div>
                </div>`;
            carregarPendentes(id);
        }

        // --- TODAS AS FUNÇÕES DE LÓGICA COPIADAS INTEGRALMENTE DO SEU TXT ---

        async function lancar(id, ant) {
            let atuInput = document.getElementById('inp-atual').value;
            let atu = parseInt(atuInput);
            const cliente = clientes[id];
            let consumo, tarifa, total;

            if (cliente.usar_valor_fixo) {
                consumo = 0; tarifa = 0; total = valorFixoGlobal;
                if(isNaN(atu)) atu = ant;
            } else {
                if(isNaN(atu) || atu < ant) return alert("Erro: Nova leitura inválida!");
                consumo = atu - ant;
                tarifa = cliente.isento_tarifa ? 0 : taxaFixa;
                total = (consumo * precoM3) + tarifa;
            }

            const nova = {
                id_cliente: id, nome_cliente: cliente.nome, leitura_anterior: ant, leitura_atual: atu,
                consumo: consumo, valor: total, valor_tarifa: tarifa, data_leitura: new Date().toLocaleDateString('pt-BR'),
                pago: false, tipo_cobranca: cliente.usar_valor_fixo ? "FIXA" : "M3"
            };

            await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`, {method:'POST', body:JSON.stringify(nova)});
            await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {method:'PATCH', body:JSON.stringify({leitura_atual: atu})});
            
            gerarPDF(cliente, ant, atu, consumo, total, tarifa);
            atualizarLista().then(() => exibirCliente(id));
        }

        async function reimprimir(idCli) {
            try {
                const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
                const cobs = await r.json();
                
                if(!cobs) {
                    alert("Não existem cobranças registradas.");
                    return;
                }
                
                // Localiza a última cobrança
                let chaves = Object.keys(cobs).filter(key => cobs[key] && String(cobs[key].id_cliente) === String(idCli));
                if(chaves.length > 0) {
                    // Ordena para pegar a mais recente pela leitura_atual
                    chaves.sort((a, b) => Number(cobs[b].leitura_atual) - Number(cobs[a].leitura_atual));
                    const idCob = chaves[0];
                    const u = cobs[idCob];
                    const cliente = clientes[idCli];

                    // --- LÓGICA DE RECÁLCULO FORÇADO ---
                    let ant = Number(u.leitura_anterior || 0);
                    let atu = Number(u.leitura_atual || 0);
                    let cons = Number(u.consumo || 0);
                    let novoTotal, novaTarifa;

                    if (cliente.usar_valor_fixo) {
                        novaTarifa = 0;
                        novoTotal = valorFixoGlobal;
                    } else {
                        novaTarifa = cliente.isento_tarifa ? 0 : taxaFixa;
                        novoTotal = (cons * precoM3) + novaTarifa;
                    }

                    // --- ATUALIZAÇÃO DO FINANCEIRO NO BANCO ---
                    // Isso garante que o valor no histórico e débitos pendentes mude também
                    await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas/${idCob}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({
                            valor: novoTotal,
                            valor_tarifa: novaTarifa,
                            tipo_cobranca: cliente.usar_valor_fixo ? "FIXA" : "M3"
                        })
                    });

                    // --- GERA O PDF COM OS VALORES NOVOS ---
                    gerarPDF(cliente, ant, atu, cons, novoTotal, novaTarifa);

                    // --- ATUALIZA A INTERFACE ---
                    carregarPendentes(idCli); // <--- ESTA LINHA ATUALIZA OS DÉBITOS PENDENTES
                    
                    // Atualiza a tela para mostrar o novo valor na lista de pendentes
                    exibirCliente(idCli);
                    alert("Fatura recalculada e atualizada com sucesso!");
                } else { 
                    alert("Nenhuma fatura encontrada.");
                }
            } catch(e) {
                console.error("Erro:", e);
                alert("Erro ao processar e atualizar a fatura.");
            }
        }

        async function editarCliente(id) {
            const c = clientes[id];
            const nNome = prompt("Editar Nome:", c.nome);
            const nRua = prompt("Editar Rua:", c.rua || "");
            const nNum = prompt("Editar Número:", c.numero || "");
            if (nNome && confirm("Confirmar alteração?")) {
                await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {
                    method: 'PATCH', body: JSON.stringify({nome: nNome.toUpperCase(), rua: nRua.toUpperCase(), numero: nNum})
                });
                alert("Atualizado!"); atualizarLista().then(() => exibirCliente(id));
            }
        }

        async function excluirCliente(id) {
            if (confirm(`⚠️ Excluir ${clientes[id].nome}?`) && confirm("TEM CERTEZA?")) {
                await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {method: 'DELETE'});
                alert("Removido!"); atualizarLista();
                document.getElementById('painel-cliente').innerHTML = `<div style="text-align:center;padding:50px;"><h2>Cliente Excluído</h2></div>`;
            }
        }

        async function verHistorico(idCli) {
            const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
            const cobs = await r.json() || {};
            document.getElementById('modal-titulo').innerText = "HISTÓRICO: " + clientes[idCli].nome;
            let html = "<table><tr><th>Data</th><th>m³</th><th>Valor</th><th>Status</th></tr>";
            let lista = Object.values(cobs).filter(c => c.id_cliente === idCli).sort((a,b) => b.leitura_atual - a.leitura_atual);
            lista.forEach(c => {
                html += `<tr><td>${c.data_leitura}</td><td>${c.consumo}</td><td>R$ ${c.valor.toFixed(2)}</td><td>${c.pago?'✅':'❌'}</td></tr>`;
            });
            document.getElementById('modal-dados').innerHTML = html + "</table>";
            abrirModal('modal-lista');
        }

        async function relatorioConsumoMensal() {
        try {
            const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
            const cobs = await r.json() || {};
            
            const hoje = new Date();
            const mesAtual = (hoje.getMonth() + 1).toString().padStart(2, '0');
            const anoAtual = hoje.getFullYear().toString();
            
            let consumoMensal = 0;
            document.getElementById('modal-titulo').innerText = `CONSUMO MENSAL (${mesAtual}/${anoAtual})`;
            
            let html = "<table><tr><th>Morador</th><th>Data</th><th>Consumo</th></tr>";

            for(let id in cobs) {
                const c = cobs[id];
                if(c && c.data_leitura && c.consumo) {
                    // Extrai MM/AAAA da string "15/03/2024"
                    const partes = c.data_leitura.split('/');
                    const mesCob = partes[1];
                    const anoCob = partes[2];

                    // Filtra apenas se for o mês e ano corrente
                    if(mesCob === mesAtual && anoCob === anoAtual) {
                        const valorConsumo = parseFloat(c.consumo);
                        consumoMensal += valorConsumo;
                        
                        html += `<tr>
                            <td>${c.nome_cliente}</td>
                            <td>${c.data_leitura}</td>
                            <td><b>${valorConsumo} m³</b></td>
                        </tr>`;
                    }
                }
            }

            if(consumoMensal === 0) {
                html = "<p style='text-align:center; padding:20px;'>Nenhuma leitura encontrada para este mês.</p>";
            } else {
                html += `</table><h2 style="text-align:right; color:var(--azul); margin-top:20px;">Total do Mês: ${consumoMensal.toFixed(2)} m³</h2>`;
            }

            document.getElementById('modal-dados').innerHTML = html;
            abrirModal('modal-lista');
        } catch(e) {
            console.error("Erro ao calcular consumo mensal:", e);
            alert("Erro ao buscar dados na nuvem.");
        }
    }

        // Mantendo as funções de PDF e Recibo exatamente como no seu arquivo original
        function calcularDataVencimento() {
            let agora = new Date(); let mes = agora.getMonth() + 1; let ano = agora.getFullYear();
            if (agora.getDate() > diaVencimento) { mes++; if (mes > 12) { mes = 1; ano++; } }
            return `${diaVencimento.toString().padStart(2, '0')}/${mes.toString().padStart(2, '0')}/${ano}`;
        }

        function gerarPDF(cli, ant, atu, cons, total, vTarifa) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            const hoje = new Date().toLocaleDateString('pt-BR'); const venc = calcularDataVencimento();
            doc.setFillColor(31, 83, 141); doc.rect(0, 0, 210, 30, 'F'); doc.setTextColor(255, 255, 255); doc.setFontSize(18);
            doc.text("FATURA DA ÁGUA - " + comunidade, 105, 20, {align:'center'});
            doc.setTextColor(0, 0, 0); doc.setFontSize(11); doc.text("DADOS DO CONSUMIDOR", 20, 45); doc.line(20, 47, 190, 47);
            doc.text(`NOME: ${cli.nome}`, 20, 55); doc.text(`ENDEREÇO: ${cli.rua || 'N/A'}, Nº ${cli.numero || 'S/N'}`, 20, 62);
            doc.text(`LOCALIDADE: ${comunidade}`, 20, 69); doc.text(`Emissão: ${hoje}`, 150, 55);
            doc.setFont("helvetica", "bold"); doc.text("DETALHAMENTO DA LEITURA", 20, 85); doc.line(20, 87, 190, 87);
            doc.setFontSize(10); doc.text("L. ANT", 20, 95); doc.text("L. ATU", 65, 95); doc.text("CONS", 110, 95); doc.text("PREÇO m³", 155, 95);
            doc.setFont("helvetica", "normal"); doc.text(`${ant} m³`, 20, 102); doc.text(`${atu} m³`, 65, 102); doc.text(`${cons} m³`, 110, 102); doc.text(`R$ ${precoM3.toFixed(2)}`, 155, 102);
            doc.line(20, 110, 190, 110);
            if (cli.usar_valor_fixo) { doc.setFont("helvetica", "bold"); doc.text(`Valor Fixo:`, 20, 120); doc.text(`R$ ${total.toFixed(2)}`, 160, 120); }
            else { doc.text(`Consumo:`, 20, 120); doc.text(`R$ ${(cons * precoM3).toFixed(2)}`, 160, 120); doc.text(`Tarifa:`, 20, 128); doc.text(`R$ ${(Number(vTarifa)||0).toFixed(2)}`, 160, 128); }
            doc.setFillColor(240, 240, 240); doc.rect(20, 140, 170, 25, 'F'); doc.setFont("helvetica", "bold"); doc.text("VENCIMENTO", 30, 155); doc.text(venc, 85, 155);
            doc.text("TOTAL", 125, 155); doc.setTextColor(200, 0, 0); doc.text(` R$ ${total.toFixed(2)}`, 160, 155);
            doc.setFillColor(400, 100, 0); doc.rect(20, 160, 170, 18, 'F'); doc.setTextColor(31, 83, 141); doc.text("PAGAMENTO", 25, 167); doc.setTextColor(0,0,0); doc.setFontSize(14); doc.text(dadosPagamento, 25, 173);
            doc.save(`fatura_${cli.nome.replace(/\s/g, '_')}.pdf`);
        }

        // Funções de Configuração e Baixa (Originais)
        async function carregarPendentes(idCli) {
            const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
            const cobs = await r.json() || {};
            const p = document.getElementById('lista-pendentes'); p.innerHTML = "";
            for(let id in cobs) {
                if(cobs[id].id_cliente === idCli && !cobs[id].pago) {
                    p.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee; background:#fff;">
                        <span style="font-size:12px;">📅 ${cobs[id].data_leitura} | <b>R$ ${cobs[id].valor.toFixed(2)}</b></span>
                        <button class="btn btn-laranja" onclick="darBaixa('${id}')">BAIXA</button>
                    </div>`;
                }
            }
        }

        async function darBaixa(id) {
            if(confirm("Confirmar recebimento?")) {
                const respCob = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas/${id}.json`);
                const cob = await respCob.json();
                await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas/${id}.json`, {method:'PATCH', body:JSON.stringify({pago:true})});
                alert("Sucesso!"); exibirCliente(idSelecionado);
            }
        }

        // Outras configurações (Preço, Tarifa, etc)
        function definirPreco() { let n = prompt("Preço m³:", precoM3); if(n) fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`, {method:'PATCH', body:JSON.stringify({valor_m3: parseFloat(n)})}).then(carregarConfig); }
        function definirTarifa() { let n = prompt("Tarifa Fixa:", taxaFixa); if(n) fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`, {method:'PATCH', body:JSON.stringify({taxa_fixa: parseFloat(n)})}).then(carregarConfig); }
        function definirValorFixo() { let n = prompt("Valor Fixo:", valorFixoGlobal); if(n) fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`, {method:'PATCH', body:JSON.stringify({valor_fixo_padrao: parseFloat(n)})}).then(carregarConfig); }
        function definirDiaVencimento() { let n = prompt("Dia Vencimento:", diaVencimento); if(n && n > 0 && n <= 31) fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`, {method:'PATCH', body:JSON.stringify({dia_vencimento: parseInt(n)})}).then(carregarConfig); }
        async function definirPagamento() { let p = prompt("Dados Pix/Banco:", dadosPagamento); if (p !== null) { await fetch(`${URL_FB}/licencas/${ID_MAQUINA}.json`, {method: 'PATCH', body: JSON.stringify({ dados_pagamento: p })}); carregarConfig(); } }
        async function salvarCliente() {
            const n = document.getElementById('cad-nome').value.toUpperCase();
            const r = document.getElementById('cad-rua').value.toUpperCase();
            const nu = document.getElementById('cad-num').value;
            if(!n) return;
            await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes.json`, {method:'POST', body:JSON.stringify({nome:n, rua:r, numero:nu, leitura_atual:0, isento_tarifa:false, usar_valor_fixo:false})});
            fecharModais(); atualizarLista();
        }
        async function setIsencao(id, val) { await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {method:'PATCH', body:JSON.stringify({isento_tarifa: val})}); clientes[id].isento_tarifa = val; }
        async function setUsaFixo(id, val) { await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/clientes/${id}.json`, {method:'PATCH', body:JSON.stringify({usar_valor_fixo: val})}); clientes[id].usar_valor_fixo = val; }
        function trocarAssinatura() { if(confirm("Trocar ID?")) { localStorage.removeItem('id_licenca_ativa'); location.reload(); } }
        function gerarQRAcesso() { const win = window.open("", "", "width=400,height=500"); win.document.write(`<div style="text-align:center; padding:20px;"><h3>ACESSO</h3><div id="q" style="display:inline-block"></div><h4>ID: ${ID_MAQUINA}</h4></div>`); new QRCode(win.document.getElementById("q"), ID_MAQUINA); }
        async function relatorioTodosDebitos() {
            const r = await fetch(`${URL_FB}/dados_clientes/${ID_MAQUINA}/cobrancas.json`);
            const cobs = await r.json() || {};
            let total = 0; document.getElementById('modal-titulo').innerText = "DÉBITOS GERAIS";
            let html = "<table><tr><th>Morador</th><th>Valor</th></tr>";
            for(let id in cobs) { if(!cobs[id].pago) { total += cobs[id].valor; html += `<tr><td>${cobs[id].nome_cliente}</td><td style="color:red">R$ ${cobs[id].valor.toFixed(2)}</td></tr>`; } }
            document.getElementById('modal-dados').innerHTML = html + `</table><h3 style="text-align:right">Total: R$ ${total.toFixed(2)}</h3>`;
            abrirModal('modal-lista');
        }
    </script>
</body>
